[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nti-attack-library"
version = "0.1.0"
description = "Executable, cryptographically signed attack framework for AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "ube-foundation>=0.1.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "jsonschema>=4.0.0",
]

[project.scripts]
nti-attack = "cli.main:main"

[tool.setuptools.packages.find]
include = ["nti_attack*", "attacks*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
