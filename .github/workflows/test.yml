name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install pytest pytest-asyncio jsonschema httpx click rich
          pip install ube-foundation || echo "optional"
          pip install -e . || true

      - name: Unit tests
        run: pytest tests/unit -v
      - name: Contract tests
        run: pytest tests/contract -v
      - name: Attack reproduction
        run: pytest tests/attack_reproduction -v
      - name: Attestation tests
        run: pytest tests/attestation -v
      - name: Federation tests
        run: pytest tests/federation -v
      - name: Integration tests
        run: pytest tests/integration -v
      - name: Failure tests
        run: pytest tests/failure -v
      - name: Security tests
        run: pytest tests/security -v
      - name: Differential tests
        run: pytest tests/differential -v
      - name: Chaos tests
        run: pytest tests/chaos -v
      - name: Performance tests
        run: pytest tests/performance -v
